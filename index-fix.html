<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3aa9e8">
<title>Смайлик Кликер — технический перерыв</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  body {
    background: linear-gradient(180deg, #a8e0ff 0%, #6ec6ff 40%, #3aa9e8 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    padding: 24px;
    text-align: center;
  }

  /* Смайлик — «дышит» */
  .smiley {
    font-size: 140px;
    line-height: 1;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
    animation: breathe 3s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
  }
  .smiley:active { transform: scale(0.92); transition: transform 0.1s; }
  @keyframes breathe {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.08) rotate(-3deg); }
  }

  /* Счётчик — декоративный */
  .counter {
    font-size: 30px;
    font-weight: 800;
    margin-top: 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    letter-spacing: 0.5px;
    min-height: 40px;
  }
  .counter .coin {
    display: inline-block;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    position: relative;
    line-height: 1;
  }
  .counter .coin::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 50%; transform: translateX(-50%);
    width: 80%; height: 3px;
    background: #ffd700; border-radius: 2px;
  }

  /* Заголовок */
  .title {
    font-size: 22px;
    font-weight: 800;
    margin-top: 28px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    letter-spacing: 0.5px;
  }

  /* Подзаголовок */
  .subtitle {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 10px;
    line-height: 1.6;
    max-width: 320px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  }

  /* Точки-загрузка */
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.4;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }

  /* Мелкий текст внизу */
  .footer {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    opacity: 0.7;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    padding: 0 16px;
  }
</style>
</head>
<body>

  <div class="smiley" id="smiley">😃</div>

  <div class="counter" id="counter">0 <span class="coin">c</span></div>

  <div class="title">Технический перерыв</div>
  <div class="subtitle">
    Мы обновляем игру: чиним сохранения, оффлайн и добавляем новое.<br>
    Скоро вернёмся — весь прогресс в безопасности.
  </div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="footer">Спасибо за терпение 💙</div>

<script>
  // Telegram init (только для expand — чтобы заглушка была на весь экран)
  const tg = window.Telegram?.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  // ⚠️ ВАЖНО: НЕ трогаем localStorage. Никаких save/load/clear.
  // Данные игроков лежат под ключом 'smileyClickerSave' (или '_v5' — старый)
  // и останутся нетронутыми, пока мы их не перезапишем в новой версии.

  // Декоративный счётчик — просто «тикает» для живости.
  // Ничего не сохраняет, ни на что не влияет.
  let count = 0;
  const counterEl = document.getElementById('counter');
  const smileyEl = document.getElementById('smiley');

  smileyEl.addEventListener('click', () => {
    count += 1;
    counterEl.innerHTML = count.toLocaleString('ru-RU').replace(/,/g, ' ') + ' <span class="coin">c</span>';
    // лёгкая вибрация, если доступна
    if (tg?.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    }
    // «поп»-анимация
    smileyEl.style.animation = 'none';
    void smileyEl.offsetWidth;
    smileyEl.style.animation = 'breathe 3s ease-in-out infinite';
  });
</script>
</body>
</html>
